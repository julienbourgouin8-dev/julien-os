<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Cosmos">
  <!-- Icône Cosmos redessinée d'après le visuel Instagram (planète + anneaux). Approximation : demander le vectoriel d'origine au client. -->
  <defs>
    <!-- les anneaux passent derrière la moitié haute de la planète -->
    <mask id="cm-behind">
      <rect width="240" height="200" fill="#fff"/>
      <path d="M86 104 a34 34 0 0 1 68 0 z" transform="rotate(-8 120 104)" fill="#000"/>
    </mask>
    <clipPath id="cm-planet"><circle cx="120" cy="104" r="34"/></clipPath>
  </defs>
  <circle class="cm-orbit" cx="121" cy="98" r="64" fill="none" stroke="currentColor" stroke-width="6"/>
  <circle class="cm-planet" cx="120" cy="104" r="34" fill="#039ae4"/>
  <path d="M100 86 a22 22 0 0 1 24 -12 a26 26 0 0 0 -18 22 z" fill="#0284c7" opacity=".55" clip-path="url(#cm-planet)"/>
  <g class="cm-rings" fill="none" stroke="currentColor" stroke-linecap="round" transform="rotate(-8 120 108)" mask="url(#cm-behind)">
    <ellipse class="cm-ring" cx="120" cy="108" rx="112" ry="24" stroke-width="4.5"/>
    <ellipse class="cm-ring" cx="120" cy="108" rx="96" ry="17" stroke-width="4"/>
    <ellipse class="cm-ring" cx="120" cy="108" rx="80" ry="11" stroke-width="3.5"/>
  </g>
</svg>
