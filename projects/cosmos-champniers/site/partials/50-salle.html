        <span class="sl-slide__shade" aria-hidden="true"></span>

      <button class="sl-slide" type="button" data-i="4" data-img="salle-lounge" data-w="1738" data-caption="Le salon lounge" aria-label="Agrandir la photo : Le salon lounge">
        <span class="sl-slide__media"><img src="assets/img/salle-lounge-sm.webp" srcset="assets/img/salle-lounge-sm.webp 1000w, assets/img/salle-lounge.webp 1738w" sizes="(max-width: 760px) 80vw, 60vw" width="1738" height="1738" alt="Banquettes rondes dorées sous des disques lumineux bleus au plafond" loading="lazy" decoding="async" draggable="false"></span>

      <button class="sl-slide" type="button" data-i="5" data-img="salle-cerisier" data-w="1738" data-caption="Le cerisier" aria-label="Agrandir la photo : Le cerisier">

        <span class="sl-slide__shade" aria-hidden="true"></span>
      </button>
      <button class="sl-slide" type="button" data-i="6" data-img="salle-orbites" data-w="1821" data-caption="La table des orbites" aria-label="Agrandir la photo : La table des orbites">

  <div class="sl-bar container">
    <p class="sl-caption" aria-live="polite"><span class="sl-count" data-sl-count hidden></span><span class="sl-caption__txt" data-sl-caption>L'allée des planètes</span></p>
    <div class="sl-arrows">
      <button class="sl-arrow" type="button" data-sl-prev aria-label="Photo précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="sl-arrow" type="button" data-sl-next aria-label="Photo suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>

  <div class="sl-lb" role="dialog" aria-modal="true" aria-label="Photo de la salle en plein écran" hidden>
    <div class="sl-lb__bg"></div>
    <div class="sl-lb__frame">
      <div class="sl-lb__layer"><div class="sl-lb__pan"><img alt="" decoding="async"></div></div>
      <div class="sl-lb__layer"><div class="sl-lb__pan"><img alt="" decoding="async"></div></div>
    </div>
    <div class="sl-lb__ui">
      <p class="sl-lb__cap"><span class="sl-count" data-lb-count hidden></span><span class="sl-lb__txt" data-lb-caption></span></p>
      <button class="sl-lb__btn sl-lb__close" type="button" data-lb-close aria-label="Fermer la photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <button class="sl-lb__btn sl-lb__prev" type="button" data-lb-prev aria-label="Photo précédente"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="sl-lb__btn sl-lb__next" type="button" data-lb-next aria-label="Photo suivante"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
